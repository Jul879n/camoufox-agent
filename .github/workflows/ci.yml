name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.browser-mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        browser-mode: [default, compatibility]
    env:
      CAMOUFOX_MCP_BROWSER_COMPATIBILITY: ${{ matrix.browser-mode == 'compatibility' && '1' || '0' }}
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Check release version synchronization
      run: node tests/check_release_versions.mjs

    - name: Install dependencies including the compatibility launcher
      run: npm ci --include=optional

    - name: Install Firefox and virtual-display dependencies
      run: |
        node node_modules/playwright-core/cli.js install-deps firefox
        sudo apt-get install -y --no-install-recommends \
          xauth libnss3 libdbus-glib-1-2 libpci3 libxss1 libxtst6
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    
    - name: Run lint, audit, and unit tests
      run: |
        npm run lint
        npm audit
        npm run test:unit
      timeout-minutes: 10

    - name: Fetch verified browser assets (${{ matrix.browser-mode }})
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: npm run fetch:camoufox
      timeout-minutes: 10

    - name: Run browser client tests (${{ matrix.browser-mode }})
      run: npm run test:local
      timeout-minutes: 25
